# Los tres gates que corren antes de que nada entre en `main`.
#
# **Y una cuarta comprobación que no es sobre este código**: los vectores oficiales de
# la AEAT se ejecutan como parte de `pytest`. Son la definición de correcto para el
# cálculo de la huella, así que si un cambio los rompe, el cambio está mal — no
# ellos. Eso es lo que hace que esta herramienta pueda afirmar algo sobre el
# cumplimiento de otros.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Se declara soporte para 3.11, 3.12 y 3.13, así que las tres se prueban. Una
      # versión declarada y no ejecutada es una promesa que nadie ha comprobado.
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy

      - name: pytest
        run: python -m pytest -q

      # La herramienta corriendo sobre sus propios ejemplos: el conforme no debe dar
      # errores y el roto debe darlos. Un `--help` que no falla no prueba que la CLI
      # haga su trabajo; esto sí.
      - name: La CLI sobre los ejemplos
        run: |
          python -m verifactu_lint.cli ejemplos/cadena-conforme.xml
          if python -m verifactu_lint.cli ejemplos/cadena-rota.xml; then
            echo "::error::la cadena rota debería haber salido con código 1"
            exit 1
          fi
